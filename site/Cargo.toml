[package]
name = "site"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# Keyed by the library name, which is what the code says: `use webmcp::Tool`.
webmcp = { package = "webmcp-rs", path = "..", features = ["dioxus"] }
dioxus = { version = "0.7.9", features = ["web"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1"

# The agent console pokes at `document.modelContext` directly. That is demo
# scaffolding — playing the agent — not something the crate should expose.
futures-util = "0.3"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document"] }
